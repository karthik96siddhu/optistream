name: Test & Report

# When to run this pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: macos-latest # GitHub's macOS runner (similar to your Mac)

    steps:
      # Step 1: Get your code
      - uses: actions/checkout@v3

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run tests with Allure
      - name: Run tests
        run: |
          pytest app/tests -v --alluredir=allure-results

      # Step 5: Generate Allure report
      - name: Generate Allure Report
        if: always() # Run even if tests fail
        run: |
          brew install allure
          allure generate allure-results -o allure-report --clean

      # Step 6: Upload report as artifact (view in GitHub)
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: allure-report/

      # Step 7: Add test summary to PR (optional)
      - name: Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Pytest Results
          path: ".pytest_cache/**/*.xml"
          reporter: "java-junit"
          fail-on-error: false
