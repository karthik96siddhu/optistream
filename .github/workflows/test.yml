name: Test & Report

# When to run this pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest # Use Ubuntu for better container support
    
    # Add permissions for test reporting
    permissions:
      contents: read
      checks: write
      pull-requests: write

    # Add MySQL service container
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: optistream_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      # Step 1: Get your code
      - uses: actions/checkout@v4

      # Step 2: Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 3.1: Install MySQL client tools
      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      # Step 3.5: Create .env file for tests (using container database)
      - name: Create .env file
        run: |
          cat > .env << EOF
          DATABASE_URL=mysql+aiomysql://root:testpass@localhost:3306/optistream_test
          TEST_DATABASE_URL=mysql+aiomysql://root:testpass@localhost:3306/optistream_test
          SECRET_KEY=github-actions-test-key-${{ github.run_id }}
          DEBUG=False
          EOF

      # Step 4: Wait for MySQL to be ready
      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..60}; do
            if mysqladmin ping -h 127.0.0.1 -u root -ptestpass --silent; then
              echo "✅ MySQL is ready!"
              exit 0
            fi
            echo "⏳ Attempt $i/60: MySQL not ready yet, waiting..."
            sleep 2
          done
          echo "❌ MySQL failed to start after 120 seconds"
          exit 1

      # Step 4.1: Verify MySQL connection
      - name: Verify MySQL Connection
        run: |
          echo "Testing MySQL connection..."
          mysql -h 127.0.0.1 -u root -ptestpass -e "SELECT 1;"
          echo "Listing databases..."
          mysql -h 127.0.0.1 -u root -ptestpass -e "SHOW DATABASES;"

      # Step 5: Run tests with Allure
      - name: Run tests
        run: |
          pytest app/tests -v --alluredir=allure-results --junit-xml=test-results.xml

      # Step 6: Generate Allure report
      - name: Generate Allure Report
        if: always() # Run even if tests fail
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre
          wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.23.1/allure-commandline-2.23.1.zip
          unzip allure-commandline-2.23.1.zip
          ./allure-2.23.1/bin/allure generate allure-results -o allure-report --clean

      # Step 7: Upload report as artifact (view in GitHub)
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      # Step 8: Add test summary to PR
      - name: Test Report
        if: always()
        uses: dorny/test-reporter@v1.8.0
        with:
          name: Pytest Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false
