version: "3.8"

services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000" # API Port (FastAPI communicates here)
      - "9001:9001" # Web Console UI Port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  # Automate bucket creation on startup
  createbuckets:
    image: minio/minio:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin) do echo 'Waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/optistream-invoices;
      exit 0;
      "
